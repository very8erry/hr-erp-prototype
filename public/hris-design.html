spec:()=>sectionHeading('기능명세서','업무 → 기능의 계층을 선택하면 목적·선행조건·입력·규칙·출력·예외·저장소·검증 근거를 확인할 수 있습니다. 참고 이미지의 기능 트리와 상세 패널 구성을 HRIS에 맞춰 재구성했습니다.')+picker()+`<div class="split">${featureTree()}${featureDetail()}</div>`,
process:()=>sectionHeading('업무 프로세스 정의서','담당 책임, 선행 조건, 원천 입력, 시스템 처리, 산출물과 예외를 정의합니다. 유저플로우의 화면 이동과 구분해 업무 완료 조건에 초점을 맞춥니다.')+picker()+links()+`<div class="panel"><h3>BP-${m().id} ${m().name}</h3><p>${esc(m().goal)}</p><p><b>시작 조건</b> ${esc(m().steps[0])} · 관련 고용/업무 원천 존재</p><div class="stageList">${m().steps.map((s,i)=>`<div class="stageRow"><b>${String(i+1).padStart(2,'0')}</b><span>${i===2||i===3?'시스템 / HR 확인':'HR 관리자'}</span><div><b style="color:inherit">${esc(s)}</b><br><small>${i===0?'해당 단계의 대상·기간과 선행 원천을 확인한다. 생성·등록 단계는 명시된 저장 동작을 수행한다.':i===1?'입력 사유·기간·대상을 확인한다.':i===2?esc(m().exception):i===3?'검증에 실패하면 저장하지 않고 보완 단계로 돌아간다.': '결과를 대사하고 후속 모듈에서 같은 참조를 사용한다.'}</small></div></div>`).join('')}</div><h4>사용 원천·산출 저장소</h4><p>${m().stores.join(' · ')}</p><h4>업무 종료 기준</h4><ul>${m().features.map(f=>`<li>${esc(f.output)}</li>`).join('')}</ul><h4>예외 책임</h4><p>HR 담당자는 근거를 정정하고 재실행한다. 시스템은 잠긴 자료·잘못된 참조·중복 저장을 거부한다. 외부 기관의 승인/접수 판단을 앱 내부 완료 상태로 대신하지 않는다.</p></div>`,
flow:()=>sectionHeading('유저플로우','화면을 한꺼번에 얽어 그리지 않고 업무별 흐름으로 분리했습니다. 시작·화면·시스템 판단·오류 보완을 구분하고 직각 연결선과 예/아니요 분기를 사용합니다.')+picker()+links()+`<div class="flowLegend"><span>둥근 도형: 시작</span><span>사각형: 화면/처리</span><span>마름모: 검증 분기</span><span>아래 경로: 오류 후 재시도</span></div><div class="flowFrame">${flowSvg(m())}</div><div class="note">${esc(m().exception)}</div><div class="panel"><h3>네 가지 연결의 실제 점검 결과</h3><ul><li><b>급여 → 대시보드:</b> 계산 결과 참조는 기존에도 존재. 이번에는 계산액·지급완료액·일용직 발생액을 분리했다.</li><li><b>근태 ↔ 휴직:</b> 같은 고용관계와 날짜를 대조한다. 승인 휴직을 결근으로 자동 생성하지 않으며, 휴직창에 근태 원본 대조를 추가했다.</li><li><b>직원 → 복지:</b> 등록된 employmentId를 선택한다. 미등록 대상 차단은 기존 로직으로 검증됐다.</li><li><b>각 모듈 → 공통 로그:</b> 기존에도 공통 저장소가 있다. 회사정보·정산설정의 누락된 로그를 추가했다. 모든 클릭을 기록한다는 의미는 아니다.</li></ul></div>`,
concept:()=>sectionHeading('개념적 데이터 모델','업무의 핵심 개체와 관계를 설명합니다. 여기서는 필드 타입을 생략하고, 상세 속성과 PK/참조는 논리적 ERD에서 확인합니다.')+`<div class="grid"><div class="panel"><h3>사람과 고용</h3><div class="relRow"><div class="relBox">사람<br><small>개인의 기본정보</small></div><div class="relArrow">1 : 여러 고용</div><div class="relBox">고용관계<br><small>회사·사번·입퇴사</small></div></div><p>같은 사람의 복수 고용을 표현할 수 있는 구조다. 현재 재입사 자동 재사용·동일인 병합은 구현 정책이 확정되지 않았으므로 자동화하지 않는다.</p></div><div class="panel"><h3>원천과 결과</h3><div class="relRow"><div class="relBox">근태·휴직·보상</div><div class="relArrow">산출 기준</div><div class="relBox">급여 입력·결과</div></div><p>근태는 근로 사실, 휴직은 기간·유형·처리 근거, 보상은 적용 이력이다. 급여 결과와 원천 데이터를 같은 개체로 합치지 않는다.</p></div></div><div class="panel"><h3>업무 개체 관계</h3>${[['회사','고용관계','소속'],['고용관계','근태 기록','근로 사실'],['고용관계','휴직 사례','기간·처리'],['고용관계','복지 신청','신청 주체'],['급여월','직원별 입력·결과','대상·계산'],['급여 결과','대시보드·신고·정산','조회·집계'],['회사·규정·이슈','업무일정','계획 근거'],['각 업무 변경','공통 로그','감사 추적']].map(([a,b,c])=>`<div class="relRow"><div class="relBox">${a}</div><div class="relArrow">${c}</div><div class="relBox">${b}</div></div>`).join('')}<p class="dim">이 관계는 참조 목적을 나타냅니다. 화면 이동이나 외래키의 자동 강제를 뜻하지 않습니다.</p></div>`,
erd:()=>sectionHeading('논리적 ERD','실제 TypeScript 모델과 IndexedDB 저장소를 연결합니다. DBMS가 외래키를 강제하지 않으므로 참조 규칙과 유일성 검증을 애플리케이션에서 확인해야 합니다.')+picker()+links()+`<div class="note">FK 표기는 논리적 참조입니다. 실제 IndexedDB 외래키 제약이 아닙니다. Person 재사용 가능 구조와 현재 등록 흐름의 자동 재사용 미구현은 구분합니다.</div><div class="panel"><h3>ERD-${m().id} · 관계와 카디널리티</h3>${erdDiagram()||'<p>회사 설정 내부 저장 또는 다형 참조입니다. 아래 필드 정의를 확인하세요.</p>'}</div><div class="schemaCards">${entities().map(([type,store])=>`<article class="entity"><h4>${store}<br><small>${type}</small></h4>${(SCHEMA[type]?.fields||[]).slice(0,9).map(f=>`<div class="field">${f.name==='id'?'<b>PK</b> ':f.name.endsWith('Id')?'<span class="tag">참조</span> ':''}${esc(f.name)}${f.optional?' ?':''}</div>`).join('')}<div style="padding:12px"><button class="link" onclick="modal(sectionHeading('${type}','${store}')+fieldTable('${type}'))">전체 ${SCHEMA[type]?.fields.length||0}개 필드·타입</button></div></article>`).join('')}</div><div class="panel"><h3>원장별 불변 조건</h3><ul><li>일별 근태: employmentId + workDate 유일 인덱스.</li><li>급여 입력: runId + employmentId 유일 인덱스.</li><li>월 집계: 고용관계·귀속월 중복 방지. 관련 업그레이드/앱 검사를 확인한다.</li><li>휴직: 고용관계별 기간 중복·updatedAt 충돌·잠긴 급여 영향 검사.</li><li>조직·보상 이력: 적용기간 중복 및 잘못된 참조를 허용하지 않는다.</li><li>auditLogs: entityType + entityId는 다형 참조. 업무 테이블 모두에 강제 FK가 있는 구조가 아니다.</li></ul>${codeLink('src/infrastructure/db/config.ts')}</div>`,
wire:()=>sectionHeading('와이어프레임','배포 사이트의 메뉴·탭·입력·표를 기준으로 화면 구조를 재구성했습니다. 이전 HTML의 와이어프레임을 설계 근거로 사용하지 않았습니다. 실제 화면 캡처와 구분되는 저충실도 설계입니다.')+picker()+links()+wireScreen()+`<div class="panel"><h3>WF-${m().id} 화면–데이터 대응</h3><div class="stageList">${[['1','조회 입력','기간·조직·직원 필터는 조회 조건이며 저장 레코드가 아니다.'],['2','업무 명령',m().features.map(f=>f.name).join(' / ')],['3','결과 표',m().fields.join(' · ')],['4','예외·상태',m().exception]].map(([n,a,b])=>`<div class="stageRow"><b>${n}</b><b>${a}</b><span>${esc(b)}</span></div>`).join('')}</div><p>데이터 연결: ${m().stores.join(' → ')}</p><button class="link" onclick="nav('erd')">관련 논리적 ERD 보기 ↔</button></div>`,
system:()=>sectionHeading('상세 시스템 설계','배포·모듈 책임·읽기/쓰기 경계·상태 전이·저장 무결성을 실제 소스 기준으로 설명합니다. 로컬 수정과 배포 기준을 구분합니다.')+`<div class="architecture"><div><b>GitHub Pages</b><p>정적 HTML / JS / CSS</p><small>업무 DB 서버 없음</small></div><div><b>브라우저 React</b><p>메뉴·입력·검증 표시</p><small>App / 업무별 Page</small></div><div><b>서비스·도메인</b><p>급여·근태·운영 규칙</p><small>PayrollService / rules</small></div><div><b>IndexedDB</b><p>hr-training-simulator</p><small>스키마 v7 / 로컬 트랜잭션</small></div></div>${picker()}${links()}<div class="grid"><div class="panel"><h3>SD-${m().id} 책임과 데이터</h3><p>${esc(m().goal)}</p><dl class="slots"><dt>화면</dt><dd>${esc(m().screen)}</dd><dt>원천/저장소</dt><dd>${m().stores.join('<br>')}</dd><dt>진입 근거</dt><dd>${codeLink(m().source)}</dd><dt>실패 처리</dt><dd>${esc(m().exception)}</dd></dl></div><div class="panel"><h3>데이터 수명주기</h3><ol><li>입력 시 형식·필수·참조를 검사한다.</li><li>트랜잭션 내 최신 상태를 재확인한다.</li><li>원천 변경은 잠긴 결과를 보호하고 미확정 결과를 무효화한다.</li><li>저장과 감사로그를 가능한 동일 트랜잭션으로 묶는다.</li><li>실패 시 롤백하고 원본 PK·이력·수기값을 유지한다.</li></ol><p class="dim">이번에 보완한 경로: 휴직 저장·회사정보·정산설정. 모든 기존 경로가 이 규칙을 완전히 만족한다는 전수 판정은 하지 않았습니다.</p></div></div><div class="panel"><h3>급여 상태 전이</h3><div class="toolbar">${['DRAFT','CALCULATED','VALIDATED','CONFIRMED','CLOSED','PAID'].map(x=>`<span class="tag">${x}</span>`).join(' → ')}</div><p>근태·휴직 정정 시 미확정 Run은 DRAFT로 돌아가고 계산결과·검증시각이 무효화된다. 확정/마감/지급 데이터는 자동 덮어쓰지 않는다. 근태 마감과 급여 마감은 다른 상태다.</p><h3>급여 계산 시퀀스</h3><ol><li>Run·입력·항목·근태 월/일 원본·휴직·로그 저장소에 트랜잭션을 연다.</li><li>Run 잠금 및 대상 존재를 검사한다.</li><li>연동 항목의 최신 시간과 revision을 읽고 산출 함수를 호출한다.</li><li>입력 스냅샷·결과·Run 상태·로그를 함께 저장한다.</li><li>중간 실패는 전체 롤백한다. 확정 직전에 원본과 검증 버전을 재대사한다.</li></ol>${codeLink('src/infrastructure/db/indexedDb.ts',780)}</div><div class="panel"><h3>보안·백업·배포 경계</h3><p>IndexedDB는 브라우저 origin별로 분리되므로 localhost와 GitHub Pages 자료는 자동 공유되지 않는다. 전체 백업·복원으로 이동하며 실제 개인정보 입력은 이 로컬 교육환경의 보안 범위를 별도로 검토해야 한다.</p><p>저장소 이름·버전·PK를 변경하지 않았고, 기존 데이터를 초기화하거나 대량 병합하지 않았다. 서버 인증·RBAC·중앙 감사 저장은 실사용 전 추가 설계 대상이다.</p></div>`,
compare:()=>sectionHeading('기획 ↔ 설계 정합성','무엇을 원했는지와 어떤 화면·필드·규칙으로 구현했는지를 나란히 대조합니다. 실행 근거가 없는 항목을 자동으로 ‘일치’ 처리하지 않습니다.')+`<div class="compareSummary">${['일치','부분 일치','불일치','미검증'].map(s=>`<button onclick="compareFilter='${s}';filterCompare()"><b>${allFeatures().filter(f=>comparison(f)===s).length}</b>${s}</button>`).join('')}</div><div class="note">일치 = 명시한 검사 범위 통과 · 부분 일치 = 코드/화면은 대응하나 전체 수용기준 검증 부족 · 불일치 = 요구 대비 구현 부재 · 미검증 = 판단 근거 부족. 문서 수나 타입 존재만으로 달성률을 계산하지 않습니다.</div><div class="toolbar"><input id="compareSearch" type="search" placeholder="기능·데이터·업무명 검색" oninput="filterCompare()"><button class="btn" onclick="compareFilter='전체';filterCompare()">전체 보기</button><span id="cmpCount"></span></div><div class="tableWrap"><table class="matrix"><thead><tr><th>대조 대상</th><th>기획 기준</th><th>설계 대응</th><th>판정·검증 근거</th><th>코드·상세</th></tr></thead><tbody id="cmpBody"></tbody></table></div><div class="panel"><h3>남은 결정·검증</h3><ul><li>휴직을 근태로부터 자동 생성하는 정책은 채택하지 않았다. 승인·기간·유급/무급 근거와 실제 근태의 대조가 우선이다.</li><li>전용 급여명세서·개별 교부, 실제 공단/세무 제출, 실제 메시지 송신은 별도 종단 검증이 필요하다.</li><li>복지 선정 자격, 재입사 Person 재사용·사번 재사용은 업무 정책 결정 사항이다.</li><li>전체 로그는 공통 변경 이력의 범위다. 모든 조회·버튼 이벤트까지 기록하는 감사 수준은 별도 정책이다.</li></ul></div>`
};
function sources(){modal(sectionHeading('작성 근거와 검증 범위','기존 기획 문서의 복제가 아닌 사이트·코드 기반 재작성')+`<p><b>현행 근거</b> <a href="${D.site}" target="_blank">배포 HRIS</a> · 2026-11-23 Chrome 실제 화면 확인 · Build 0.7.9 · main ${D.sha.slice(0,7)}.</p><p>대시보드·근태·복지 신청·공통 로그·급여·일용직·회사정보·업무일정·수시업무·채용 화면을 조회했습니다. 실제 사용자 DB의 저장·삭제·초기화는 수행하지 않았습니다.</p><h3>이번 수정·검증</h3><ul><li>회사정보·정산설정 로그 누락: 수정 전 실패 → 수정 후 통과.</li><li>동시 중복 휴직: 수정 전 두 건 저장 → 수정 후 한 건만 저장.</li><li>오래된 휴직 덮어쓰기·지급완료 급여 보호·미등록 복지 롤백: 통과.</li><li>대시보드 계산/지급/일용직 발생액·귀속월/지급월 분리: 통과.</li><li>휴직 화면에서 선택 기간의 일별 근태·급여처리·메모 대조를 추가.</li></ul><p id="verificationNote">기존 릴리스 검증·TypeScript·Vite 빌드 통과. 신고초안 원자성 테스트 통과. 시험 범위는 각 기능의 근거 파일에 표시했습니다. 브라우저 및 추가 양식 시험 결과는 최종 검증 기록을 참조하세요.</p><h3>구글 이미지 검색 참고 4종</h3><p>이미지의 개체·관계·속성·PK/FK·단계 구분을 참고했습니다. HRIS 내용과 레이아웃은 별도로 작성했고 원본 이미지를 복제하지 않았습니다.</p><ol class="sourceList"><li><a href="https://www.thoughtspot.com/data-trends/data-modeling/conceptual-vs-logical-vs-physical-data-models" target="_blank">ThoughtSpot · 모델 단계 비교</a> — 개념 / 논리 / 물리의 역할 구분.</li><li><a href="https://systemarchitect.info/data/logical-data-modeling-the-how-to/" target="_blank">System Architect · Logical Data Modeling</a> — 관계·식별자·카디널리티 배치.</li><li><a href="https://www.visual-paradigm.com/support/documents/vpuserguide/3563/3564/85378_conceptual,l.html" target="_blank">Visual Paradigm · Conceptual, Logical and Physical</a> — 개체명·속성·식별 키.</li><li><a href="https://www.datensen.com/products/luna-modeler/conceptual-data-model/" target="_blank">Datensen · Conceptual Data Model</a> — 개체·속성·관계의 구분.</li></ol><p>추가 시각 참고: 사용자가 제공한 기능 트리·상세 패널·직각 유저플로우 이미지. 사내 HRIS 모델에 맞게 재구성했습니다.</p><h3>한계</h3><p>사이트 화면만으로 내부 데이터 구조를 확정하지 않았습니다. 필드는 실제 TypeScript 인터페이스에서 추출하고 저장소는 config.ts와 대조했습니다. 이 문서는 법령 인증, 전 기능 테스트 통과, 외부 신고 성공을 뜻하지 않습니다.</p>`)}

function diagramPicker(){return `<div class="toolbar"><label>모델 범위 <select aria-label="모델 범위" onchange="erdScope=this.value;erdFocus='';render()"><option value="CORE" ${erdScope==='CORE'?'selected':''}>전체 핵심 모델</option><option value="ALL" ${erdScope==='ALL'?'selected':''}>전체 저장 엔터티</option>${D.modules.map(g=>`<option value="${g.id}" ${erdScope===g.id?'selected':''}>${g.name}</option>`).join('')}</select></label><button class="btn" onclick="setDiagramScale(.75)">축소</button><button class="btn" onclick="setDiagramScale(1)">맞춤</button><button class="btn" onclick="setDiagramScale(1.6)">확대</button><button class="btn" onclick="erdFocus='';render()">관계 선택 해제</button></div>`}

function diagramStores(){if(erdScope==='ALL')return Object.values(D.pairs);if(erdScope==='CORE')return coreStores;const g=D.modules.find(x=>x.id===erdScope);const set=new Set(g.stores.filter(s=>Object.values(D.pairs).includes(s)));D.relations.forEach(([a,b])=>{if(g.stores.includes(b)){set.add(a);set.add(b)}});return [...set]}
function erdDiagram(concept=false){const stores=diagramStores(), cols=stores.length>10?4:3, boxW=260,boxH=concept?108:225,gapX=160,gapY=125;const width=cols*(boxW+gapX)+80,height=Math.ceil(stores.length/cols)*(boxH+gapY)+60;const pos=Object.fromEntries(stores.map((s,i)=>[s,{x:45+(i%cols)*(boxW+gapX),y:35+Math.floor(i/cols)*(boxH+gapY)}]));const relations=D.relations.filter(r=>pos[r[0]]&&pos[r[1]]);let nodes=stores.map(s=>{const typ=Object.keys(D.pairs).find(t=>D.pairs[t]===s),schema=SCHEMA[typ],p=pos[s],fields=[...schema.fields].sort((a,b)=>(a.name==='id'?-2:a.name.endsWith('Id')?-1:0)-(b.name==='id'?-2:b.name.endsWith('Id')?-1:0)).slice(0,7);const focused=!erdFocus||s===erdFocus||relations.some(r=>(r[0]===erdFocus&&r[1]===s)||(r[1]===erdFocus&&r[0]===s));return `<g class="entityNode" opacity="${focused?1:.25}" tabindex="0" role="button" aria-label="${s} 관계 선택" onclick="erdFocus=erdFocus==='${s}'?'':'${s}';render()" onkeydown="if(event.key==='Enter')this.onclick()"><rect x="${p.x}" y="${p.y}" width="${boxW}" height="${boxH}" rx="3" fill="white" stroke="${s===erdFocus?'#315cce':'#78909f'}" stroke-width="${s===erdFocus?2.5:1.4}"/><path d="M${p.x} ${p.y+45}h${boxW}" stroke="#b6c5cf"/><rect x="${p.x+1}" y="${p.y+1}" width="${boxW-2}" height="43" fill="#e8eff6"/>${svgText(p.x+boxW/2,p.y+20,names[s]||typ,24,14)}${svgText(p.x+boxW/2,p.y+38,concept?'':s,35,11)}${concept?svgText(p.x+130,p.y+77,typ,27,13):fields.map((f,i)=>{const ref=relations.find(r=>r[1]===s&&r[4]===f.name);return `<text x="${p.x+10}" y="${p.y+65+i*21}" font-size="11" fill="${ref?'#315cce':'#556e7e'}">${f.name==='id'?'PK':ref?'FK':''}</text><text x="${p.x+43}" y="${p.y+65+i*21}" font-size="12" fill="#263d4b">${esc(f.name)}${f.optional?' ?':''}</text>`}).join('')}<title>${s} · ${schema.fields.length}개 필드 · 전체 정의는 데이터 사전</title></g>`}).join('');const edges=relations.map((r,i)=>{const a=pos[r[0]],b=pos[r[1]],sameRow=a.y===b.y;const sameCol=a.x===b.x, forward=b.x>a.x;const ax=a.x+boxW,ay=a.y+boxH/2,bx=b.x+(sameCol||!forward?boxW:0),by=b.y+boxH/2;let path;const offset=24+(i%5)*15,srcRail=a.x+boxW+offset,dstRail=bx+(sameCol||!forward?offset:-offset);if(sameCol){path=`M${ax} ${ay}H${srcRail}V${by}H${bx}`}else if(sameRow&&Math.abs(a.x-b.x)===boxW+gapX&&forward){path=`M${ax} ${ay}H${bx}`}else{const laneY=a.y+boxH+28+(i%5)*15;path=`M${ax} ${ay}H${srcRail}V${laneY}H${dstRail}V${by}H${bx}`}const active=!erdFocus||r[0]===erdFocus||r[1]===erdFocus;return `<g opacity="${active?.85:.06}"><path d="${path}" fill="none" stroke="#4b728c" stroke-width="1.4" marker-start="url(#${r[2]==='1'?'one':'zeroOne'})" marker-end="url(#many)"/><text x="${bx+(forward?-7:7)}" y="${by-12}" text-anchor="${forward?'end':'start'}" font-size="10" fill="#315cce" paint-order="stroke" stroke="white" stroke-width="4">${esc(r[4])}</text></g>`}).join('');return `<div class="diagramViewport erdViewport"><svg class="erdSvg" style="width:${diagramScale*100}%;min-width:${diagramScale===1?0:diagramScale*1000}px" viewBox="0 0 ${width} ${height}" role="img" aria-label="${concept?'개념적':'논리적'} ERD"><defs><marker id="one" viewBox="0 0 20 20" refX="0" refY="10" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M6 3V17M11 3V17" stroke="#4b728c" fill="none"/></marker><marker id="zeroOne" viewBox="0 0 24 20" refX="0" refY="10" markerWidth="20" markerHeight="16" orient="auto-start-reverse"><circle cx="16" cy="10" r="4" fill="white" stroke="#4b728c"/><path d="M6 3V17" stroke="#4b728c"/></marker><marker id="many" viewBox="0 0 27 20" refX="27" refY="10" markerWidth="23" markerHeight="18" orient="auto"><circle cx="6" cy="10" r="4" stroke="#4b728c" fill="white"/><path d="M14 10L27 2M14 10H27M14 10L27 18" stroke="#4b728c" fill="none"/></marker></defs><rect width="${width}" height="${height}" fill="#fbfcfe"/>${edges}${nodes}</svg></div>`}
function erdLegend(){return `<div class="note">PK 기본키 · FK 논리적 참조 · || 정확히 1 · ○| 0 또는 1 · ○〈 0 이상 다수. 엔터티를 클릭하면 연결 관계만 강조합니다. IndexedDB는 SQL 외래키를 강제하지 않으며, 참조 검증은 저장 로직의 책임입니다.</div>`}

renderers.physical=()=>sectionHeading('물리적 데이터 모델','현재 제품은 SQL 서버가 아니라 브라우저 IndexedDB입니다. 가상의 SQL DDL 대신 실제 저장소·키·인덱스·트랜잭션 경계를 정의합니다.')+`<div class="panel"><h3>${PHYSICAL.db} · version ${PHYSICAL.version}</h3><p>GitHub Pages → 브라우저 React → 서비스/도메인 → IndexedDB. origin마다 별도 보관하며 서버에 업무 DB가 자동 전송되지 않습니다. 모든 저장소 keyPath는 id입니다.</p>${codeLink('src/infrastructure/db/config.ts')} · ${codeLink('src/infrastructure/db/indexedDb.ts')}<p>스키마 버전·PK 변경 없음. 백업은 전체 JSON 스냅샷이며 복원 검증 후 트랜잭션으로 반영합니다.</p></div><div class="tableWrap"><table><thead><tr><th>Object store</th><th>타입</th><th>키</th><th>인덱스 keyPath</th><th>유일성</th></tr></thead><tbody>${PHYSICAL.stores.map(s=>`<tr><td><code>${s.name}</code></td><td>${Object.keys(D.pairs).find(t=>D.pairs[t]===s.name)||'구조화 객체 / 메타·이력'}</td><td>id</td><td>${(s.indexes||[]).map(i=>`${i.name}: ${Array.isArray(i.keyPath)?i.keyPath.join(' + '):i.keyPath}`).join('<br>')||'기본키 조회'}</td><td>${(s.indexes||[]).map(i=>i.unique?'UNIQUE':'비유일').join('<br>')||'PK 유일'}</td></tr>`).join('')}</tbody></table></div><div class="panel"><h3>주요 원자적 저장 단위</h3><ul><li>급여 계산: 입력·결과·Run 상태·감사로그</li><li>휴직 저장: 직원 참조·기간 충돌·잠긴 급여 검사 → 휴직·미확정 급여 무효화·로그</li><li>회사/정산설정·원천세 초안: company + auditLogs</li><li>ATS 입사전환: 회사 채용 상태 + Person·Employment·발령·보상·로그</li></ul><p>외래키 강제는 없음. 유일 인덱스와 저장 시 검증을 함께 사용합니다. 별도 모듈의 원자성은 해당 코드·시험 근거를 확인합니다.</p></div>`;
function dictionaryTable(){const q=($('#dictSearch')?.value||'').toLowerCase(),store=$('#dictStore')?.value||'';let rows=[];for(const [t,s] of Object.entries(D.pairs)){if(store&&s!==store)continue;for(const f of SCHEMA[t].fields){const r=D.relations.find(r=>r[1]===s&&r[4]===f.name),idx=PHYSICAL.stores.find(x=>x.name===s)?.indexes?.filter(i=>[i.keyPath].flat().includes(f.name))||[];if(q&&!JSON.stringify([t,s,f]).toLowerCase().includes(q))continue;rows.push(`<tr><td>${s}<br><small>${t}</small></td><td><code>${f.name}</code></td><td>${esc(f.type)}</td><td>${f.optional?'선택':'필수'}${f.type.includes('null')?' / null 허용':''}</td><td>${f.name==='id'?'PK':r?'FK → '+r[0]+'.id':'일반 속성'}</td><td>${idx.map(i=>i.name+(i.unique?' UNIQUE':'')).join('<br>')||'—'}</td><td>${codeLink(SCHEMA[t].source,f.line)}</td></tr>`)}}$('#dictCount').textContent=rows.length+'개 필드';$('#dictBody').innerHTML=rows.join('')}
renderers.dictionary=()=>sectionHeading('데이터 사전','실제 타입에서 추출한 필드명·타입·선택 여부와 저장소 인덱스를 결합했습니다. 코드의 의미를 추정해 법정 판정이나 외래키 제약을 만들어 넣지 않았습니다.')+`<div class="toolbar"><input id="dictSearch" type="search" placeholder="필드·타입·저장소 검색" oninput="dictionaryTable()"><select id="dictStore" aria-label="저장소" onchange="dictionaryTable()"><option value="">모든 저장소</option>${Object.values(D.pairs).map(s=>`<option>${s}</option>`).join('')}</select><span id="dictCount"></span></div><div class="tableWrap"><table><thead><tr><th>저장소 / 타입</th><th>필드</th><th>타입·값 범위</th><th>입력 조건</th><th>키·참조</th><th>인덱스</th><th>정의 근거</th></tr></thead><tbody id="dictBody"></tbody></table></div>`;
const ia=[['대시보드','DASH',['회사 캘린더','일일 현황·진행 이슈','일별 근태·발생액','월별 인원·급여']],['업무일정','OPS',['월 달력','날짜별 적용업무표','반복·수기 일정','달력/목록 엑셀']],['수시업무관리','OPS',['이슈별 현재 단계','업무 진행 타임라인']],['직원 관리','HR',['직원 검색·목록','직원 원천정보','인사발령','첨부문서']],['근태','ATT',['근태 조회','근태 캘린더','휴직 등록·수정','연차 조회·촉진']],['급여','PAY',['급여 입력','급여 조회','근태 조회','일용직 급여','퇴직정산','연말정산','원천세 신고','4대보험 신고','급여요약','급여 설정']],['일용직','DAY',['명부','근무·수당 목록','신고자료 확정·마감','근로내용확인신고 출력']],['회사정보','CO',['회사정보','회사 캘린더','취업규칙','세칙','직종코드','업무 사이트','공지게시판']],['로그','LOG',['전체 변경 이력']],['채용','ATS',['지원자','채용평가','일정','키워드 검토']],['복지','WEL',['직장어린이집 신청·선정']]];
renderers.ia=()=>sectionHeading('정보구조도(IA)','현재 HRIS 메뉴의 진입 계층입니다. 기획 문서 메뉴와 실제 제품 메뉴를 혼동하지 않도록 제품의 좌측 메뉴와 내부 기능을 구분했습니다.')+`<div class="iaRoot">HRIS 워크스페이스</div><div class="iaGrid">${ia.map(([n,g,tabs])=>`<article><h3>${n}</h3><ul>${tabs.map(t=>`<li><button class="link" onclick="overview=false;nav('wire','${g}')">${t}</button></li>`).join('')}</ul><small>WF-${g} · ${D.modules.find(m=>m.id===g).source}</small></article>`).join('')}</div><div class="note">확장 모듈 중 비활성 기능은 구현 기능에서 제외합니다. 내부 탭 표시는 권한·선택 상태에 따라 달라질 수 있습니다. 전환은 React 상태 기반이며 모든 탭이 독립 URL을 가지는 구조는 아닙니다.</div>${codeLink('src/app/App.tsx')}`;
renderers.screen=()=>sectionHeading('화면 상세설계','화면 요소와 사용자의 입력, 실행 결과, 오류 처리를 기능·데이터 정의로 연결합니다. 와이어프레임은 배치, 이 문서는 동작 계약을 설명합니다.')+picker()+links()+`<div class="panel"><h3>SD-${m().id} · ${m().screen}</h3><dl class="slots"><dt>사용자</dt><dd>HR 관리자 · 로컬 실습 환경</dd><dt>진입</dt><dd>IA의 ${m().screen} 선택</dd><dt>조회 원천</dt><dd>${m().stores.map(s=>`<code>${s}</code>`).join(' · ')}</dd><dt>초기 표시</dt><dd>${m().id==='ATT'||m().id==='PAY'||m().id==='DAY'?'조회기간은 당월을 기본값으로 사용. 적용된 조회 조건과 편집 중 조건을 구분.':m().steps[0]}</dd><dt>표시 항목</dt><dd>${m().fields.join(' · ')}</dd><dt>반응형·접근</dt><dd>긴 표는 표 내부 스크롤. 버튼은 키보드 접근 가능. 오류는 입력창 가까이 명시하고 저장 성공과 구분.</dd></dl></div><div class="tableWrap"><table><thead><tr><th>요소 ID / 기능</th><th>입력·행동</th><th>검증·활성 조건</th><th>성공 후</th><th>오류·보존</th><th>연결</th></tr></thead><tbody>${m().features.map(f=>`<tr><td>UI-${f.id}<br>${f.name}</td><td>${f.input}</td><td>${f.rule}</td><td>${f.output}</td><td>${m().exception}</td><td><button class="link" onclick="openFeature('${m().id}','${f.id}')">${f.id}</button><br>${codeLink(f.source||m().source)}</td></tr>`).join('')}</tbody></table></div><div class="note">위 정의는 확인한 업무 동작입니다. 모든 화면에서 동일한 공통 자동 저장이나 서버 권한이 존재한다고 가정하지 않습니다. 저장 실패 시 자동 성공 표시를 하지 않으며 원본 보존 여부는 관련 테스트에서 확인합니다.</div>`;
function comparison(f){return f.review||'근거 재검토'}
function filterCompare(){const q=($('#compareSearch')?.value||'').toLowerCase();const list=allFeatures().filter(f=>(compareFilter==='전체'||comparison(f)===compareFilter)&&(!q||[f.id,f.name,f.rule,f.module.name,f.evidence.scope].join(' ').toLowerCase().includes(q)));$('#cmpCount').textContent=list.length+'개 기능';$('#cmpBody').innerHTML=list.map(f=>`<tr><td><button class="link" onclick="openFeature('${f.module.id}','${f.id}')">${f.id}<br>${f.name}</button></td><td>${f.rule}<br><small>결과: ${f.output}</small></td><td>${f.module.stores.map(s=>`<code>${s}</code>`).join('<br>')}<br><button class="link" onclick="nav('wire','${f.module.id}')">WF-${f.module.id}</button></td><td>${tag(comparison(f))}<br>${codeLink(f.evidence.path)}<br>${esc(f.evidence.scope)}<br><small>${f.remaining}</small></td><td><button class="link" onclick="compareDetail('${f.id}')">대조 상세</button></td></tr>`).join('')}
function compareDetail(id){const f=allFeatures().find(x=>x.id===id),g=f.module;modal(sectionHeading(f.name,'TRACE-'+id)+`<div class="grid"><section><h3>기획</h3><p>${f.rule}</p><p>${f.input} → ${f.output}</p></section><section><h3>설계</h3><p>${g.screen}</p><p>${g.stores.join(' · ')}</p>${codeLink(f.source||g.source)}</section></div><h3>재검토 판정: ${comparison(f)}</h3><p>이전: ${esc(f.previousStatus)}</p><p>${codeLink(f.evidence.path)} · ${esc(f.evidence.scope)}</p><p>함수/검사 경로: ${esc(f.evidence.function)}</p><h3>남은 범위</h3><p>${f.remaining}</p><h3>해당 영역 요구 목록</h3>${reqIds(g.id).map(r=>`<p>${r.id} · ${r.title}</p>`).join('')}<p>영역 목록은 검토 범위이며 모든 요구가 이 기능 하나로 충족된다는 의미는 아닙니다.</p>`)}
renderers.compare=()=>sectionHeading('기획·설계 정합성','이전 부분 일치·미검증 항목을 코드 경로와 실제 실행한 테스트로 재검토했습니다. 판정은 로컬 제품 범위이며 외부 신고 접수·실제 전송까지 통과했다는 의미는 아닙니다.')+`<div class="compareSummary">${['코드·시험 일치','코드 확인','기획 표현 수정','범위 구분'].map(s=>`<button onclick="compareFilter='${s}';filterCompare()"><b>${allFeatures().filter(f=>comparison(f)===s).length}</b>${s}</button>`).join('')}</div><div class="panel"><h3>재검토로 바뀐 점</h3><ul><li>단순 ‘기존 테스트’ 표기를 실제 파일·검사 사례로 교체했습니다.</li><li>‘명세서 경로 없음’은 부정확했습니다. 개인 지급·공제 내역 출력 경로가 존재하며, 법정 명세서 자동 교부와 구분했습니다.</li><li>실습용 역할 전환에 서버 인증을 요구한 불일치 판정은 범위 혼동이므로 수정했습니다.</li><li>원천세 초안과 로그 분리 저장은 실제 결함으로 재현하고 원자적 저장으로 수정했습니다.</li></ul></div><div class="toolbar"><input id="compareSearch" type="search" placeholder="기능·데이터·업무명 검색" oninput="filterCompare()"><button class="btn" onclick="compareFilter='전체';filterCompare()">전체 보기</button><span id="cmpCount"></span></div><div class="tableWrap"><table><thead><tr><th>기능</th><th>기획 규칙·결과</th><th>설계 대응</th><th>검증 근거·잔여 범위</th><th>상세</th></tr></thead><tbody id="cmpBody"></tbody></table></div>`;
function mappedModule(r){const maps={UI:'HR',DATA:'LOG',SEC:'LOG',DOC:'DOC',ISS:'OPS',REP:'TAX'};return D.modules.find(g=>g.id===(maps[r.group]||r.group))}
renderers.coverage=()=>sectionHeading('요구사항 연결 검토','요구→PRD→기능→데이터→화면의 연결을 확인합니다. 사용자의 요구 수와 확인된 기능 수를 구현 완료율로 바꾸지 않습니다.')+`<div class="panel"><h3>기획 내부 논리</h3><p>PRD의 목적은 직원 원천과 근태·급여 결과의 대사입니다. 요구사항은 사용자의 최신 지시를 우선하고, 기능명세는 입력·규칙·결과로 분해합니다. 전체 기능 보기에서 영역별 상세로 내려갑니다.</p><h3>설계 내부 논리</h3><p>업무 프로세스의 식별자 → 모듈 관계 → 개념·논리 엔터티 → 실제 IndexedDB 저장소·인덱스 → 화면 입력/조회로 연결합니다. Person과 Employment는 별개이며 복지·근태·급여는 Employment를 참조합니다.</p><h3>충돌·범위 정리</h3><ul><li>연차 업무 화면은 근태, 운영기준 설정은 급여 설정에 둡니다.</li><li>급여 계산액과 지급완료액을 혼합하지 않습니다.</li><li>회사 정보와 직원별 사회보험 원천은 분리합니다.</li><li>검토되지 않은 외부 기관 접수·법적 유효성은 코드 테스트 결과로 대체하지 않습니다.</li></ul></div><div class="tableWrap"><table><thead><tr><th>요구</th><th>PRD·기능</th><th>데이터·화면</th><th>연결 판정</th></tr></thead><tbody>${D.requirements.map(r=>{const g=mappedModule(r);return `<tr><td><button class="link" onclick="reqDetail('${r.id}')">${r.id} · ${r.title}</button></td><td>${g?`PRD-${g.id}<br>${g.features.map(f=>`<button class="link" onclick="openFeature('${g.id}','${f.id}')">${f.id}</button>`).join(' / ')}<br><small>영역 단위 대응 · 개별 요구 전체 충족 판정 아님</small>`:r.group==='DOC'?'이번 문서 메뉴·작성 기준':'공통 규칙 / 요구 상세 유지'}</td><td>${g?g.stores.join(' · ')+'<br>WF-'+g.id:'문서/공통 통제'}</td><td>${g?'설계 근거 연결':r.group==='DOC'?'산출물 반영':'개별 수용기준 추가 대조'}<br><small>구현 완료율로 계산하지 않음</small></td></tr>`}).join('')}</tbody></table></div>`;

renderers.requirements=()=>oldReqRenderer().replaceAll('161',String(D.requirements.length)).replace('기획·설계는 배포 사이트의 실제 메뉴와 최신 main 코드에서 새로 작성했습니다.','기획은 사용자 요청을 기준으로, 설계는 실제 HRIS 코드·저장소를 기준으로 작성했습니다.');
const oldPrd=renderers.prd;renderers.prd=()=>oldPrd()+`<div class="panel"><h3>문서 간 계약</h3><p>PRD 목적 → 요구사항 ID → 기능 입력·처리·출력 → 업무/데이터/화면 설계 → 시험 근거 순서로 검토합니다. 요구사항은 바람직한 동작, 설계는 현재 구현과 이번 수정의 근거입니다.</p><button class="btn" onclick="nav('coverage')">요구사항 연결 검토</button></div>`;
function links(group=selectedModule){return `<div class="linkRow">${[['prd','PRD'],['spec','기능'],['process','프로세스'],['flow','흐름'],['erd','ERD'],['dictionary','사전'],['wire','화면'],['screen','화면설계'],['compare','대조']].map(([k,l])=>`<button class="link" onclick="overview=false;nav('${k}','${group}')">${l}-${group}</button>`).join(' / ')}</div>`}

sources=()=>modal(sectionHeading('작성 근거·검증 범위','v3.0 · 2026-11-24')+`<p>기획: 대화에 명시된 사용자 요구 ${D.requirements.length}건. 설계: 실제 HRIS 소스·타입·IndexedDB 설정. 화면: 배포 서비스 및 수정 앱 Chrome 검토.</p><p>분석 기준 ${D.sha}. 이번 수정 브랜치: codex/workflow-integrity-review.</p><h3>실행 결과</h3><p>기존 릴리스 검증·TypeScript·Vite 빌드 통과. 신고초안 원자성 테스트 통과. 시험 범위는 각 기능의 근거 파일에 표시했습니다. 브라우저 및 추가 양식 시험 결과는 최종 검증 기록을 참조하세요.</p><h3>원본 보존</h3><p>DB 이름·스키마 버전·기존 PK를 바꾸지 않았습니다. 문서 버튼은 실제 HRIS 데이터에 접근하지 않습니다.</p><button class="btn" onclick="referenceImages()">ERD 참고 이미지 10개</button><h3>검증 한계</h3><p>로컬 테스트와 브라우저 표시 검증을 분리합니다. 실제 기관 접수, 실제 문자/메일, 법정 통지 도달, 서버 인증은 통과했다고 표시하지 않습니다. 현재 로컬 실습 범위의 미구현 외부 연계를 근거 없이 추가하지 않았습니다.</p>`);
