<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620"><rect width="1000" height="620" fill="white"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#456078"/></marker></defs><text x="25" y="30" font-family="Arial" font-size="22">Data flow / sources, transformed inputs and outputs</text><rect x="30" y="70" width="210" height="65" rx="0" fill="#f2f7fa" stroke="#456078" stroke-width="2"/><text x="48" y="96" font-family="Arial" font-size="18" fill="#163047">HR operator / files</text><ellipse cx="485.0" cy="105.0" rx="135.0" ry="45.0" fill="#f2f7fa" stroke="#456078" stroke-width="2"/><text x="368" y="86" font-family="Arial" font-size="18" fill="#163047">1. Register / edit</text><text x="368" y="109" font-family="Arial" font-size="18" fill="#163047">source information</text><path d="M975,70 H735 V135 H975 M747,70 V135" fill="none" stroke="#456078" stroke-width="2"/><text x="753" y="96" font-family="Arial" font-size="18" fill="#163047">D1 Master / histories</text><ellipse cx="485.0" cy="275.0" rx="135.0" ry="45.0" fill="#f2f7fa" stroke="#456078" stroke-width="2"/><text x="368" y="256" font-family="Arial" font-size="18" fill="#163047">2. Sync attendance</text><text x="368" y="279" font-family="Arial" font-size="18" fill="#163047">to payroll input</text><path d="M270,240 H30 V305 H270 M42,240 V305" fill="none" stroke="#456078" stroke-width="2"/><text x="48" y="266" font-family="Arial" font-size="18" fill="#163047">D2 Attendance</text><path d="M975,240 H735 V305 H975 M747,240 V305" fill="none" stroke="#456078" stroke-width="2"/><text x="753" y="266" font-family="Arial" font-size="18" fill="#163047">D3 Payroll entries</text><ellipse cx="485.0" cy="465.0" rx="135.0" ry="45.0" fill="#f2f7fa" stroke="#456078" stroke-width="2"/><text x="368" y="446" font-family="Arial" font-size="18" fill="#163047">3. Calculate / validate</text><path d="M975,430 H735 V495 H975 M747,430 V495" fill="none" stroke="#456078" stroke-width="2"/><text x="753" y="456" font-family="Arial" font-size="18" fill="#163047">D4 Runs / results</text><ellipse cx="150.0" cy="465.0" rx="120.0" ry="45.0" fill="#f2f7fa" stroke="#456078" stroke-width="2"/><text x="48" y="446" font-family="Arial" font-size="18" fill="#163047">4. Build filing draft</text><text x="48" y="469" font-family="Arial" font-size="18" fill="#163047">/ export</text><rect x="30" y="555" width="240" height="45" rx="0" fill="#f2f7fa" stroke="#456078" stroke-width="2"/><text x="48" y="581" font-family="Arial" font-size="18" fill="#163047">Review files (external)</text><polyline points="240,102 350,102" fill="none" stroke="#456078" stroke-width="2" marker-end="url(#a)"/><text x="275" y="90" font-family="Arial" font-size="16" fill="#163047">input</text><polyline points="620,102 735,102" fill="none" stroke="#456078" stroke-width="2" marker-end="url(#a)"/><text x="625" y="90" font-family="Arial" font-size="16" fill="#163047">master values</text><polyline points="240,115 290,115 290,220 150,220 150,240" fill="none" stroke="#456078" stroke-width="2" marker-end="url(#a)"/><text x="50" y="208" font-family="Arial" font-size="16" fill="#163047">time / leave</text><polyline points="270,272 350,272" fill="none" stroke="#456078" stroke-width="2" marker-end="url(#a)"/><text x="280" y="260" font-family="Arial" font-size="16" fill="#163047">hours</text><polyline points="620,272 735,272" fill="none" stroke="#456078" stroke-width="2" marker-end="url(#a)"/><text x="640" y="260" font-family="Arial" font-size="16" fill="#163047">amounts</text><polyline points="855,135 855,195 485,195 485,230" fill="none" stroke="#456078" stroke-width="2" marker-end="url(#a)"/><text x="575" y="185" font-family="Arial" font-size="16" fill="#163047">source snapshots</text><polyline points="855,305 855,360 485,360 485,420" fill="none" stroke="#456078" stroke-width="2" marker-end="url(#a)"/><text x="570" y="350" font-family="Arial" font-size="16" fill=